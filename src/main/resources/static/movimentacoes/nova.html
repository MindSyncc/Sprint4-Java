<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Movimentação - Laboratório Albert Einstein</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Laboratório Albert Einstein</h1>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span id="user-role">Cargo</span>
                    <a href="/logout" class="btn btn-small">Sair</a>
                </div>
            </div>
        </header>

        <nav class="sidebar">
            <div class="nav-section">
                <h3>Menu Principal</h3>
                <ul>
                    <li><a href="../dashboard.html">Dashboard</a></li>
                </ul>
            </div>
            <div class="nav-section">
                <h3>Gerenciamento de Estoque</h3>
                <ul>
                    <li><a href="../estoque/listar.html">Visualizar Estoque</a></li>
                    <li><a href="nova.html" class="active">Registrar Movimentação</a></li>
                </ul>
            </div>
        </nav>

        <main class="main-content">
            <div class="form-container">
                <h2>Registrar Nova Movimentação</h2>

                <form method="POST" action="/movimentacao/nova" id="form-nova-movimentacao">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tipo">Tipo de Movimentação *</label>
                            <select id="tipo" name="tipo_movimentacao" required onchange="atualizarMotivos()">
                                <option value="">Selecione o tipo</option>
                                <option value="Entrada">Entrada</option>
                                <option value="Saída">Saída</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="motivo">Motivo *</label>
                            <select id="motivo" name="motivo" required>
                                <option value="">Selecione o motivo</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="insumo">Insumo *</label>
                            <select id="insumo" name="id_insumo" required>
                                <option value="">Selecione um insumo</option>
                                <option value="1">Álcool 70%</option>
                                <option value="2">Luvas Nitrílicas</option>
                                <option value="3">Máscara N95</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="quantidade">Quantidade *</label>
                            <input type="number" id="quantidade" name="quantidade" required min="1" placeholder="Ex: 50">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes" name="observacoes" placeholder="Informações adicionais sobre a movimentação"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Registrar Movimentação</button>
                        <a href="../estoque/listar.html" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/modules/auth.js"></script>
    <script>
        const motivosPorTipo = {
            'Entrada': ['Reabastecimento', 'Transferência'],
            'Saída': ['Consumo', 'Vencimento', 'Avaria', 'Transferência']
        };

        document.addEventListener('DOMContentLoaded', () => {
            const user = auth.getCurrentUser();
            if (!user || user.permissao !== 'Analista Local') {
                window.location.href = '../dashboard.html';
                return;
            }

            document.getElementById('user-name').textContent = user.nome;
            document.getElementById('user-role').textContent = user.permissao;
        });

        function atualizarMotivos() {
            const tipo = document.getElementById('tipo').value;
            const motivoSelect = document.getElementById('motivo');
            motivoSelect.innerHTML = '<option value="">Selecione o motivo</option>';

            if (tipo && motivosPorTipo[tipo]) {
                motivosPorTipo[tipo].forEach(motivo => {
                    const option = document.createElement('option');
                    option.value = motivo;
                    option.textContent = motivo;
                    motivoSelect.appendChild(option);
                });
            }
        }
    </script>
</body>
</html>
