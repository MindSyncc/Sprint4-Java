<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Pedido - Laboratório MindSync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Laboratório MindSync</h1>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span id="user-role">Cargo</span>
                    <button id="btnLogout" class="btn btn-small">Sair</button>
                </div>
            </div>
        </header>

        <nav class="sidebar">
            <!-- Menu será renderizado aqui -->
        </nav>

        <main class="main-content">
            <div class="form-container">
                <h2>Criar Novo Pedido</h2>

                <div id="alertContainer"></div>

                <form id="form-novo-pedido">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fornecedor">Fornecedor *</label>
                            <select id="fornecedor" name="id_fornecedor" required>
                                <option value="">Selecione um fornecedor</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="insumo">Insumo *</label>
                            <select id="insumo" name="id_insumo" required>
                                <option value="">Selecione um insumo</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="quantidade">Quantidade *</label>
                            <input type="number" id="quantidade" name="quantidade" required min="1" placeholder="Ex: 100">
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes" name="observacoes" placeholder="Informações adicionais sobre o pedido"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Criar Pedido</button>
                        <a href="listar.html" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/pages/form-pedido.js"></script>
</body>
</html>
