<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Pedido - Laboratório Albert Einstein</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Laboratório Albert Einstein</h1>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span id="user-role">Cargo</span>
                    <a href="/logout" class="btn btn-small">Sair</a>
                </div>
            </div>
        </header>

        <nav class="sidebar">
            <div class="nav-section">
                <h3>Menu Principal</h3>
                <ul>
                    <li><a href="../dashboard.html">Dashboard</a></li>
                </ul>
            </div>
            <div class="nav-section">
                <h3>Pedidos</h3>
                <ul>
                    <li><a href="novo.html" class="active">Novo Pedido</a></li>
                    <li><a href="listar.html">Meus Pedidos</a></li>
                </ul>
            </div>
        </nav>

        <main class="main-content">
            <div class="form-container">
                <h2>Criar Novo Pedido</h2>

                <form method="POST" action="/pedido/novo" id="form-novo-pedido">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fornecedor">Fornecedor *</label>
                            <select id="fornecedor" name="id_fornecedor" required>
                                <option value="">Selecione um fornecedor</option>
                                <option value="1">Fornecedor A</option>
                                <option value="2">Fornecedor B</option>
                                <option value="3">Fornecedor C</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="insumo">Insumo *</label>
                            <select id="insumo" name="id_insumo" required>
                                <option value="">Selecione um insumo</option>
                                <option value="1">Álcool 70%</option>
                                <option value="2">Luvas Nitrílicas</option>
                                <option value="3">Máscara N95</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantidade">Quantidade *</label>
                            <input type="number" id="quantidade" name="quantidade" required min="1" placeholder="Ex: 100">
                        </div>

                        <div class="form-group">
                            <label for="dataPrevista">Data Prevista de Entrega</label>
                            <input type="date" id="dataPrevista" name="dataPrevista">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes" name="observacoes" placeholder="Informações adicionais sobre o pedido"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Criar Pedido</button>
                        <a href="listar.html" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/modules/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = auth.getCurrentUser();
            if (!user || user.permissao !== 'Analista Local') {
                window.location.href = '../dashboard.html';
                return;
            }

            document.getElementById('user-name').textContent = user.nome;
            document.getElementById('user-role').textContent = user.permissao;
        });
    </script>
</body>
</html>
