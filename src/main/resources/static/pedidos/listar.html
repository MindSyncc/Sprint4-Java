<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - Laboratório MindSync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Laboratório MindSync</h1>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span id="user-role">Cargo</span>
                    <button id="btnLogout" class="btn btn-small">Sair</button>
                </div>
            </div>
        </header>

        <nav class="sidebar">
            <!-- Menu será renderizado aqui -->
        </nav>

        <main class="main-content">

            <div id="alertContainer"></div>

            <div class="card">
                <h2>Meus Pedidos</h2>
                <p>Total de pedidos: <strong id="total-pedidos">0</strong></p>
            </div>

            <div class="table-container">
                <table id="tabela-pedidos">
                    <thead>
                        <tr id="linha-pedidos">
                            <th>ID Pedido</th>
                            <th>Insumo</th>
                            <th>Quantidade</th>
                            <th>Fornecedor</th>
                            <th>Data do Pedido</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-pedidos">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 30px;">Carregando pedidos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="pedidoModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="fecharModal" class="close">&times;</span>
            <h2>Detalhes do pedido</h2>
            <p><strong>ID: </strong> <span id="modal-id"></span></p>
            <p><strong>Item: </strong> <span id="modal-item"></span></p>
            <p><strong>Quantidade: </strong> <span id="modal-quantidade"></span></p>
            <p><strong>Fornecedor: </strong> <span id="modal-fornecedor"></span></p>
            <p><strong>Status: </strong> <span id="modal-status"></span></p>
            <p><strong>Data: </strong> <span id="modal-data"></span></p>
            <button id="btnAtender">Atender</button>

        </div>
    </div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/pages/listar-pedidos.js"></script>
</body>
</html>
