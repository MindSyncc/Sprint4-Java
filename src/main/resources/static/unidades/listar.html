<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Insumos - Laboratório MindSync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Laboratório MindSync</h1>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span id="user-role">Cargo</span>
                    <button id="btnLogout" class="btn btn-small">Sair</button>
                </div>
            </div>
        </header>

        <nav class="sidebar">
            <!-- Conteúdo do sidebar será renderizado aqui -->
        </nav>

        <main class="main-content">
            <div id="alertContainer"></div>
            
            <div class="card">
                <h2>Lista de unidades</h2>
                <p>Total de unidades: <strong id="total-insumos">0</strong></p>
            </div>

            <div class="table-container">
                <table id="tabela-insumos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Rua</th>
                            <th>Número</th>
                            <th>Bairro</th>
                            <th>Cidade</th>
                            <th>Estado</th>
                            <th>CEP</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-unidades">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 30px;">Carregando unidades...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module" src="/js/modules/auth-service.js"></script>
    <script type="module" src="/js/modules/ui-service.js"></script>
    <script type="module" src="../js/app.js"></script>
</body>
</html>
