<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Insumos - Laboratório MindSync</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Laboratório MindSync</h1>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span id="user-role">Cargo</span>
                    <button id="btnLogout" class="btn btn-small">Sair</button>
                </div>
            </div>
        </header>

        <nav class="sidebar">
            <!-- Conteúdo do sidebar será renderizado aqui -->
        </nav>

        <main class="main-content">
            <div id="alertContainer"></div>

            <div id="secao-de-consumo">
                <form id="form-consumo-insumo">
                    <div class="modal-content">
                        <div class="secao-de-consumo-header">
                            <h3>Retirar um insumo</h3>
                        </div>
                        <div class="secao-de-consumo-body">
                            <div class="form-group">
                                <label for="insumoNome">Insumo</label>
                                <select id="insumoSelect" name="insumo_nome" required>
                                    <option value="">Selecione um insumo</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="quantidadeDisponivel">Quantidade Disponível:</label>
                                <input type="text" id="quantidadeDisponivelInput" disabled class="input-disabled">
                            </div>
                            <div class="form-group">
                                <label for="quantidadeConsumir">Quantidade a Consumir:</label>
                                <input type="number" id="quantidadeConsumir" min="1" placeholder="Digite a quantidade"
                                    class="input-field">
                            </div>
                            <div class="form-group">
                                <label for="motivoConsumo">Motivo do Consumo:</label>
                                <select id="motivoConsumoSelect" name="motivo_consumo" required>
                                    <option value="">Selecione o motivo de consumo</option>
                                    <!-- Opções válidas -->
                                    <option value="Reabastecimento">Reabastecimento</option>
                                    <option value="Transferência">Transferência</option>
                                    <option value="Vencimento">Vencimento</option>
                                    <option value="Avaria">Avaria</option>
                                </select>
                            </div>
                        </div>
                        <div class="secao-de-consumo-footer">
                            <button class="btn btn-secondary">Cancelar</button>
                            <button class="btn btn-danger">Consumir</button>
                        </div>
                    </div>
                </form>
            </div>

        </main>



        <script type="module" src="../js/modules/auth-service.js"></script>
        <script type="module" src="../js/modules/ui-service.js"></script>
        <script type="module" src="../js/modules/api-service.js"></script>
        <script type="module" src="../js/pages/retirar-insumo.js"></script>
        <script type="module" src="../js/services/insumo-service.js"></script>
        <script type="module" src="../js/app.js"></script>
</body>
</html>
