<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Insumo - Laboratório Albert Einstein</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Laboratório Albert Einstein</h1>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span id="user-role">Cargo</span>
                    <button id="btnLogout" class="btn btn-small">Sair</button>
                </div>
            </div>
        </header>

        <nav class="sidebar">
            <div class="nav-section">
                <h3>Menu Principal</h3>
                <ul>
                    <li><a href="../dashboard.html">Dashboard</a></li>
                </ul>
            </div>
            <div class="nav-section">
                <h3>Gerenciamento de Insumos</h3>
                <ul>
                    <li><a href="form.html" class="active">Adicionar Insumo</a></li>
                    <li><a href="listar.html">Listar Insumos</a></li>
                    <li><a href="retirar.html">Retirar um Insumo</a>"
                </ul>
            </div>
        </nav>

        <main class="main-content">
            <div id="alertContainer"></div>
            
            <div class="form-container">
                <h2>Preencha os campos</h2>

                <form id="form-novo-insumo">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome do Insumo *</label>
                            <input type="text" id="nome" name="nome" required maxlength="100" placeholder="Ex: Álcool 70%">
                        </div>

                        <div class="form-group">
                            <label for="categoria">Categoria *</label>
                            <select id="categoria" name="id_categoria" required>
                                <option value="">Selecione uma categoria</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="lote">Lote *</label>
                            <input type="text" id="lote" name="lote" required maxlength="50" placeholder="Ex: L123456">
                        </div>

                        <div class="form-group">
                            <label for="dataValidade">Data de Vencimento *</label>
                            <input type="date" id="dataValidade" name="dataValidade" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="unidadeMedida">Unidade de Medida *</label>
                            <select id="unidadeMedida" name="unidadeMedida" required>
                                <option value="">Selecione uma unidade</option>
                                <option value="ml">Mililitro (ml)</option>
                                <option value="l">Litro (L)</option>
                                <option value="g">Grama (g)</option>
                                <option value="kg">Quilograma (kg)</option>
                                <option value="un">Unidade (un)</option>
                                <option value="cx">Caixa (cx)</option>
                                <option value="pct">Pacote (pct)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="quantidade">Quantidade *</label>
                            <input type="number" id="quantidade" name="quantidade" required min="1" placeholder="Ex: 100">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição (Opcional)</label>
                        <textarea id="descricao" name="descricao" placeholder="Informações adicionais sobre o insumo"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Adicionar Insumo</button>
                        <a href="listar.html" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="/js/modules/auth-service.js"></script>
    <script type="module" src="/js/modules/ui-service.js"></script>
    <script type="module" src="/js/modules/api-service.js"></script>
    <script type="module" src="../js/services/insumo-service.js"></script>
    <script type= "module" src="../js/pages/form-insumo.js"></script>
    <script type="module" src="../js/app.js"></script>
</body>
</html>
